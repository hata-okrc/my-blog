<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tech_glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8a2be2;stop-opacity:1" />
    </linearGradient>
    <filter id="glow_effect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="256" height="256" rx="32" fill="#1a1a2e" />

  <path d="M60,200 C60,200 80,180 100,160 L120,40 L160,20 L190,30 L170,140 C190,160 200,180 200,200 L60,200 Z" fill="#2a2a3e" stroke="url(#tech_glow)" stroke-width="4"/>

  <path d="M130,20 L100,90 L140,90 L110,180 L160,100 L120,100 L150,20 Z" fill="url(#tech_glow)" filter="url(#glow_effect)"/>

  <g stroke="url(#tech_glow)" stroke-width="2" fill="none">
    <path d="M85,145 L100,130 L100,110" />
    <circle cx="85" cy="145" r="4" fill="#00f2ff"/>
    <path d="M95,175 L110,160 L130,160" />
    <circle cx="95" cy="175" r="4" fill="#00f2ff"/>
  </g>

  <g stroke="url(#tech_glow)" stroke-width="2" fill="none">
    <path d="M175,60 L160,75 L160,90" />
    <circle cx="175" cy="60" r="4" fill="#8a2be2"/>
    <path d="M185,100 L170,115 L150,115" />
    <circle cx="185" cy="100" r="4" fill="#8a2be2"/>
  </g>
  
  <g filter="url(#glow_effect)">
      <circle cx="110" cy="50" r="8" fill="#2a2a3e" stroke="url(#tech_glow)" stroke-width="3"/>
      <circle cx="110" cy="50" r="3" fill="#00f2ff"/>
      
      <circle cx="105" cy="75" r="8" fill="#2a2a3e" stroke="url(#tech_glow)" stroke-width="3"/>
      <circle cx="105" cy="75" r="3" fill="#00f2ff"/>

      <circle cx="100" cy="100" r="8" fill="#2a2a3e" stroke="url(#tech_glow)" stroke-width="3"/>
      <circle cx="100" cy="100" r="3" fill="#00f2ff"/>
  </g>
  
  <rect x="110" y="170" width="40" height="20" rx="4" fill="#2a2a3e" stroke="url(#tech_glow)" stroke-width="2" />
  <path d="M115,180 L145,180" stroke="url(#tech_glow)" stroke-width="2" stroke-linecap="round"/>
  <path d="M115,185 L145,185" stroke="url(#tech_glow)" stroke-width="2" stroke-linecap="round"/>

</svg>